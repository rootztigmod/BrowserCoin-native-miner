name: Release standalone miner

on:
  push:
    tags:
      - 'miner-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: npm ci
      - run: npm run build:standalone
      - run: |
          env -i HOME="$RUNNER_TEMP" PATH="/usr/bin:/bin" \
            ./release/browsercoin-miner-linux-x64 --help
          env -i HOME="$RUNNER_TEMP" PATH="/usr/bin:/bin" \
            ./release/browsercoin-miner-linux-x64 --version
          env -i HOME="$RUNNER_TEMP" PATH="/usr/bin:/bin" \
            ./release/browsercoin-miner-linux-x64 --generate-key "$RUNNER_TEMP/miner.key"
          test "$(stat -c '%a' "$RUNNER_TEMP/miner.key)" = 600
          (cd release && sha256sum -c browsercoin-miner-linux-x64.sha256)
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/browsercoin-miner-linux-x64 \
            release/browsercoin-miner-linux-x64.sha256 \
            --generate-notes
